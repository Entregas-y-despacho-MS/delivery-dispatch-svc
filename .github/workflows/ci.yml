name: CI

on:
  pull_request:
  push:
    branches: [dev, test, main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Not `npm test`: that chains contracts:check, which reads the message catalog from the
      # sibling delivery-dispatch-docs repo and only exists inside the full erp/ workspace — an
      # isolated CI checkout doesn't have it. Unit tests alone don't need it.
      - run: npx vitest run

      # e2e (vitest.config.e2e.ts) needs a real Postgres loaded with the delivery-dispatch-db
      # schema, a sibling private repo — left for a follow-up once that cross-repo checkout is
      # set up. Run them locally before opening a PR in the meantime.
